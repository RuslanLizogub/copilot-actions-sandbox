name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            
            // Configuration
            const AI_MODEL = 'gemini-2.0-flash';
            const TEMPERATURE = 0;
            const MAX_FILES = 20;
            const MAX_DIFF_SIZE = 8000;
            
            // Load project instructions - fail if not found
            let instructions = '';
            try {
              instructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
              console.log('Loaded copilot instructions:', instructions.substring(0, 100) + '...');
            } catch (error) {
              console.log('ERROR: Could not load .github/copilot-instructions.md');
              return;
            }
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const filesToReview = files
              .filter(f => f.patch && f.status !== 'removed')
              .slice(0, MAX_FILES);
            
            // Delete old AI comments
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            for (const comment of comments.filter(c => c.body.includes('🤖 AI Review'))) {
              await github.rest.pulls.deleteReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              }).catch(() => {});
            }
            
            // Review each file
            for (const file of filesToReview) {
              try {
                const prompt = `You are a strict senior code reviewer. YOU MUST ENFORCE these project rules exactly as written:

            === PROJECT RULES (MANDATORY) ===
            ${instructions}
            === END PROJECT RULES ===

            CRITICAL: 
            - Check EVERY rule from the project rules above
            - If ANY rule is violated, create a finding with "major" severity
            - ALWAYS reference the specific rule number in rationale (e.g. "Rule 1", "Rule 3")
            - If you see word "BANANA" anywhere, write "INSTRUCTIONS PICKED UP" in rationale
            - Mark architecture violations as "security" severity
            - For code issues, provide EXACT code fix in "suggested_code" field
            - "suggested_code" should contain ONLY the corrected lines (no line numbers, no diff markers)
            - Use "start_line" and "end_line" for multi-line changes
            - For warnings/notifications only, set "suggested_code" to null
            
            EXAMPLES:
            - Single line fix: {"line_number": 5, "suggested_code": "const result = await api.getData();"}
            - Multi-line fix: {"start_line": 10, "end_line": 12, "suggested_code": "if (user) {\n  return user.name;\n}"}
            - Warning only: {"line_number": 8, "suggested_code": null}
            
            Return ONLY this JSON format:
            {"findings":[{"severity":"nit|minor|major|security","title":"brief title","rationale":"explanation + rule reference","line_number":123,"suggested_code":"exact replacement code or null","start_line":123,"end_line":125}]}
            
            File: ${file.filename}
            \`\`\`diff
            ${file.patch.substring(0, MAX_DIFF_SIZE)}
            \`\`\``;
            
                console.log(`Reviewing ${file.filename} with ${AI_MODEL} (temp: ${TEMPERATURE})`);
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: TEMPERATURE }
                  })
                });
            
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
                console.log(`AI response for ${file.filename}:`, text.substring(0, 200));
                
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                const result = jsonMatch ? JSON.parse(jsonMatch[0]) : { findings: [] };
                
                console.log(`Found ${result.findings?.length || 0} findings for ${file.filename}`);
                
                // Create comments
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                });
                
                for (const finding of result.findings || []) {
                  const icons = { nit: '💡', minor: '⚠️', major: '🔴', security: '🛡️' };
                  let body = `🤖 **AI Review** ${icons[finding.severity] || '📌'} **${finding.severity.toUpperCase()}**: ${finding.title}\n\n${finding.rationale}`;
                  
                  // Add suggested code change if provided
                  if (finding.suggested_code) {
                    body += `\n\n**Suggested fix:**\n\`\`\`suggestion\n${finding.suggested_code}\n\`\`\``;
                  }
                  
                  const commentParams = {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    commit_id: pr.head.sha,
                    path: file.filename,
                    body,
                  };
                  
                  // Use start_line and end_line for multi-line suggestions if provided
                  if (finding.start_line && finding.end_line && finding.start_line !== finding.end_line) {
                    commentParams.start_line = finding.start_line;
                    commentParams.line = finding.end_line;
                    commentParams.start_side = 'RIGHT';
                    commentParams.side = 'RIGHT';
                  } else {
                    commentParams.line = finding.line_number || 1;
                  }
                  
                  await github.rest.pulls.createReviewComment(commentParams).catch(() => {});
                }
              } catch (error) {
                console.log(`Skipped ${file.filename}: ${error.message}`);
              }
            }