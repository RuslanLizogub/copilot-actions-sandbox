name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            
            // Load project instructions
            const instructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const filesToReview = files
              .filter(f => f.patch && f.status !== 'removed')
              .slice(0, 20);
            
            // Delete old AI comments
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            for (const comment of comments.filter(c => c.body.includes('🤖 AI Review'))) {
              await github.rest.pulls.deleteReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              }).catch(() => {});
            }
            
            // Review each file
            for (const file of filesToReview) {
              try {
                const prompt = `You are a senior code reviewer. Follow these project rules strictly:
            
            ${instructions}
            
            Review this diff and return ONLY JSON:
            {"findings":[{"severity":"nit|minor|major|security","title":"brief title","rationale":"why + rule reference","line_number":123}]}
            
            File: ${file.filename}
            \`\`\`diff
            ${file.patch.substring(0, 8000)}
            \`\`\``;
            
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0 }
                  })
                });
            
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
                const result = JSON.parse(text.match(/\{[\s\S]*\}/))?.[0] || { findings: [] };
                
                // Create comments
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                });
                
                for (const finding of result.findings || []) {
                  const icons = { nit: '💡', minor: '⚠️', major: '🔴', security: '🛡️' };
                  const body = `🤖 **AI Review** ${icons[finding.severity] || '📌'} **${finding.severity.toUpperCase()}**: ${finding.title}\n\n${finding.rationale}`;
                  
                  await github.rest.pulls.createReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    commit_id: pr.head.sha,
                    path: file.filename,
                    line: finding.line_number || 1,
                    body,
                  }).catch(() => {});
                }
              } catch (error) {
                console.log(`Skipped ${file.filename}: ${error.message}`);
              }
            }