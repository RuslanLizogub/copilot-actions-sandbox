name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: AI Code Review with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const COMMENT_SIGNATURE = '<!-- ai-review-gemini -->';
            const MAX_FILES = 20;
            const MAX_DIFF_SIZE = 12000;
            
            // Get changed files with patches
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const filesToReview = files
              .filter(file => file.patch && file.status !== 'removed')
              .slice(0, MAX_FILES)
              .map(file => ({
                filename: file.filename,
                patch: file.patch.length > MAX_DIFF_SIZE 
                  ? file.patch.substring(0, MAX_DIFF_SIZE) + '\n... (truncated)'
                  : file.patch
              }));
            
            console.log(`Reviewing ${filesToReview.length} files`);
            
            // Review each file with Gemini
            const allFindings = [];
            for (const file of filesToReview) {
              try {
                const prompt = `You are a strict senior code reviewer. Review this diff and return ONLY a compact JSON in this exact format:
            {"findings":[{"severity":"nit|minor|major|security","title":"brief title","rationale":"why this matters","suggestion_diff":"optional unified diff fix"}]}
            
            File: ${file.filename}
            \`\`\`diff
            ${file.patch}
            \`\`\``;
            
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0 }
                  })
                });
            
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{"findings":[]}';
                
                // Extract JSON from response
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                  const result = JSON.parse(jsonMatch[0]);
                  if (result.findings?.length > 0) {
                    allFindings.push({ file: file.filename, findings: result.findings });
                  }
                }
              } catch (error) {
                console.log(`Skipping ${file.filename}: ${error.message}`);
              }
            }
            
            // Generate markdown report
            const timestamp = new Date().toISOString();
            let markdown = `${COMMENT_SIGNATURE}\n# 🤖 AI Code Review\n\n`;
            markdown += `**Model:** gemini-2.0-flash | **Files reviewed:** ${filesToReview.length} | **Time:** ${timestamp}\n\n`;
            
            if (allFindings.length === 0) {
              markdown += '✅ No issues found in the reviewed files.';
            } else {
              for (const { file, findings } of allFindings) {
                markdown += `## 📁 \`${file}\`\n\n`;
                for (const finding of findings) {
                  const icon = {
                    nit: '💡',
                    minor: '⚠️', 
                    major: '🔴',
                    security: '🛡️'
                  }[finding.severity] || '📌';
                  
                  markdown += `${icon} **${finding.severity.toUpperCase()}**: ${finding.title}\n`;
                  markdown += `${finding.rationale}\n`;
                  
                  if (finding.suggestion_diff) {
                    markdown += `\`\`\`diff\n${finding.suggestion_diff}\n\`\`\`\n`;
                  }
                  markdown += '\n';
                }
              }
            }
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes(COMMENT_SIGNATURE)
            );
            
            // Create or update comment
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: markdown,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: markdown,
              });
            }